bundle:
  name: rnd-csr-pod

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  serving_endpoint_name:
    description: Foundation Model API endpoint used by the judge (second model family)
  catalog:
    description: Unity Catalog catalog
    default: sean_zhang_catalog
  schema:
    description: Schema holding every table, volume and index of this demo
    default: rnd_csr_pod
  model_service:
    description: Unity Gateway model service for the five agents (Claude Sonnet 5.5)
    default: sean_zhang_catalog.rnd_csr_pod.csr_author
  mlflow_experiment_id:
    description: MLflow experiment for the pod traces
    default: ""

resources:
  apps:
    app:
      name: "rnd-csr-pod"
      description: "CSR Pod: drafts the whole CSR of CDISCPILOT01 and scores it against the submitted CSR"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://fevm-sean-zhang.cloud.databricks.com

    variables:
      sql_warehouse_id: 16ad82bead3f55b5
      serving_endpoint_name: databricks-gpt-5-5
