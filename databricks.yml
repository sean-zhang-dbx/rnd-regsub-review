bundle:
  name: rnd-regsub-review

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  serving_endpoint_name:
    description: Serving endpoint name
  genie_space_id:
    description: Genie Agent (space) id
  genie_space_name:
    description: Genie Agent title
  mlflow_experiment_id:
    description: MLflow experiment id for wording-check traces

resources:
  apps:
    app:
      name: "rnd-regsub-review"
      description: "LMN-301 submission review: restatement impact across CSR, Module 2 and label"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - serving.serving-endpoints
        - dashboards.genie
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: mlflow-experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_EDIT

targets:
  default:
    default: true
    workspace:
      host: https://fevm-sean-zhang.cloud.databricks.com

    variables:
      sql_warehouse_id: 16ad82bead3f55b5
      serving_endpoint_name: databricks-claude-sonnet-5-5
      genie_space_id: 01f1cbc34f071871a047d7a3489ce6d3
      genie_space_name: "Regsub Review: LMN-301 certified tables"
      mlflow_experiment_id: "1752849192687853"
